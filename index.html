<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIGO's AI Sound Collection</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at top, #292929 0%, #111 45%, #080808 100%);
  color: #fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
}

.container {
  width: min(980px, 94%);
  margin: 0 auto;
  padding: 48px 0 70px;
}

/* =========================
   HEADER
========================= */

header {
  text-align: center;
  margin-bottom: 40px;
}

/* 明日ジャケット画像を追加する場所 */
.jacket {
  width: min(360px, 78vw);
  aspect-ratio: 1 / 1;
  margin: 0 auto 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #151515;
  border: 1px solid #333;
  color: #555;
  font-size: 11px;
  letter-spacing: 3px;
}

.jacket img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  cursor: pointer;
}

.album-label {
  display: inline-block;
  margin-bottom: 14px;
  padding: 6px 15px;
  border: 1px solid #555;
  border-radius: 999px;
  color: #aaa;
  font-size: 10px;
  letter-spacing: 3px;
}

header h1 {
  margin: 0;
  font-size: clamp(30px, 7vw, 58px);
  line-height: 1.05;
  letter-spacing: 1px;
  font-weight: 800;
}

header h1 span {
  display: block;
  margin-top: 12px;
  color: #888;
  font-size: clamp(11px, 2vw, 14px);
  letter-spacing: 5px;
  font-weight: 400;
}

/* =========================
   DISC TABS
========================= */

.disc-tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 30px;
}

.disc-tab {
  flex: 0 1 180px;
  padding: 13px 25px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #181818;
  color: #888;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  transition: all 0.25s ease;
}

.disc-tab:hover {
  color: #fff;
  border-color: #777;
  transform: translateY(-1px);
}

.disc-tab.active {
  background: #fff;
  color: #111;
  border-color: #fff;
}

/* =========================
   DISC PANEL
========================= */

.disc-panel {
  display: none;
  animation: fadeIn 0.25s ease;
}

.disc-panel.active {
  display: block;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.disc-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 8px;
  padding: 0 4px 14px;
  border-bottom: 1px solid #444;
}

.disc-heading h2 {
  margin: 0;
  font-size: 24px;
  letter-spacing: 2px;
}

.disc-heading span {
  color: #666;
  font-size: 11px;
}

/* =========================
   TRACK
========================= */

.track {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) 52px auto;
  align-items: center;
  gap: 12px;
  min-height: 68px;
  padding: 12px 4px;
  border-bottom: 1px solid #242424;
}

.track:hover {
  background: rgba(255,255,255,0.025);
}

.track-number {
  color: #666;
  font-size: 12px;
  text-align: right;
}

.track-title {
  min-width: 0;
  font-size: 14px;
  line-height: 1.4;
}

.track-time {
  color: #777;
  font-size: 12px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.track-actions {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 7px;
}

/* =========================
   BUTTONS
========================= */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 100px;
  padding: 9px 12px;
  border-radius: 7px;
  text-decoration: none;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  white-space: nowrap;
  transition:
    transform 0.2s ease,
    opacity 0.2s ease,
    background 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
  opacity: 0.85;
}

.btn:active {
  transform: translateY(0);
}

.play {
  background: #fff;
  color: #111;
}

.download {
  background: #292929;
  color: #ddd;
  border: 1px solid #444;
}

/* =========================
   BONUS TRACK
========================= */

.bonus {
  margin-top: 12px;
  border-top: 1px solid #555;
}

.bonus .track-number {
  color: #aaa;
}

.bonus .track-title {
  font-weight: 700;
}

.bonus-label {
  display: inline-block;
  margin-left: 7px;
  color: #777;
  font-size: 10px;
  letter-spacing: 1px;
}

/* =========================
   FOOTER
========================= */

footer {
  margin-top: 55px;
  padding-top: 20px;
  border-top: 1px solid #222;
  text-align: center;
  color: #555;
  font-size: 10px;
  letter-spacing: 2px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  .container {
    width: 94%;
    padding-top: 30px;
  }

  header {
    margin-bottom: 30px;
  }

  .jacket {
    width: min(300px, 78vw);
  }

  header h1 {
    font-size: clamp(27px, 8vw, 42px);
  }

  .disc-tabs {
    gap: 7px;
  }

  .disc-tab {
    flex: 1;
    padding: 11px 8px;
  }

  .track {
    grid-template-columns: 24px minmax(0, 1fr);
    gap: 8px;
    padding: 13px 2px;
  }

  .track-number {
    text-align: right;
    padding-top: 3px;
  }

  .track-title {
    font-size: 13px;
  }

  .track-time {
    grid-column: 2;
    grid-row: 2;
    text-align: left;
    margin-top: -4px;
    font-size: 11px;
  }

  .track-actions {
    grid-column: 2;
    grid-row: 3;
    justify-content: flex-start;
    margin-top: 4px;
  }

  .btn {
    min-width: 92px;
    padding: 8px 9px;
    font-size: 10px;
  }

  .bonus .track-actions {
    margin-top: 4px;
  }
}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 380px) {

  .track-actions {
    gap: 5px;
  }

  .btn {
    min-width: 82px;
    padding: 7px 7px;
    font-size: 9px;
  }

  .track-title {
    font-size: 12px;
  }
}
</style>
</head>

/* =========================
   CREATE TRACK
========================= */

function createTrack(track) {

  const listenURL =
    "https://drive.google.com/file/d/" +
    track.id +
    "/view?usp=drive_link";

  const downloadURL =
    "https://drive.google.com/uc?export=download&id=" +
    track.id;

  const div = document.createElement("div");

  div.className =
    track.bonus
      ? "track bonus"
      : "track";

  div.innerHTML = `

    <span class="track-number">
      ${track.no}
    </span>

    <span class="track-title">
      ${track.title}

      ${
        track.bonus
          ? '<span class="bonus-label">BONUS TRACK</span>'
          : ""
      }
    </span>

    <span class="track-time">
      ${track.time}
    </span>

    <div class="track-actions">

      <a
        class="btn play"
        href="${listenURL}"
        target="_blank"
        rel="noopener"
      >
        ▶ LISTEN
      </a>

      <a
        class="btn download"
        href="${downloadURL}"
        target="_blank"
        rel="noopener"
      >
        ↓ DOWNLOAD
      </a>

    </div>

  `;

  return div;
}


/* =========================
   RENDER TRACKS
========================= */

function renderTracks() {

  const container1 =
    document.getElementById("tracks1");

  const container2 =
    document.getElementById("tracks2");

  disc1.forEach(track => {

    container1.appendChild(
      createTrack(track)
    );

  });

  disc2.forEach(track => {

    container2.appendChild(
      createTrack(track)
    );

  });

}


/* =========================
   DISC SWITCH
========================= */

function showDisc(number) {

  document
    .querySelectorAll(".disc-panel")
    .forEach(panel => {

      panel.classList.remove("active");

    });

  document
    .querySelectorAll(".disc-tab")
    .forEach(tab => {

      tab.classList.remove("active");

    });

  document
    .getElementById("disc" + number)
    .classList.add("active");

  document
    .querySelectorAll(".disc-tab")[number - 1]
    .classList.add("active");

}


/* =========================

renderTracks();
