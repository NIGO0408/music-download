<style>

/* ========================================
   BASIC
======================================== */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

  margin: 0;

  min-height: 100vh;

  color: #172033;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;

  transition:
    background 0.5s ease;
}


/* ========================================
   DISC BACKGROUND
======================================== */

body.disc1 {

  background:
    linear-gradient(
      180deg,
      #38aef0 0%,
      #72cef4 35%,
      #c9f0ff 72%,
      #f3fbff 100%
    );

}


body.disc2 {

  background:
    linear-gradient(
      180deg,
      #f6a62d 0%,
      #f8bd57 35%,
      #ffd79b 72%,
      #fff0d5 100%
    );

}


/* ========================================
   MAIN CONTAINER
======================================== */

.container {

  width:
    min(960px, 94%);

  margin:
    0 auto;

  padding:
    35px 0 60px;

}


/* ========================================
   HEADER
======================================== */

header {

  text-align:
    center;

  margin-bottom:
    30px;

}


/* ========================================
   JACKET
======================================== */

.jacket {

  width:
    min(360px, 78vw);

  aspect-ratio:
    1 / 1;

  margin:
    0 auto 25px;

  overflow:
    hidden;

  border:
    3px solid rgba(255,255,255,0.9);

  border-radius:
    18px;

  background:
    rgba(255,255,255,0.35);

  box-shadow:
    0 15px 35px rgba(30,70,100,0.20);

}


.jacket img {

  width:
    100%;

  height:
    100%;

  display:
    block;

  object-fit:
    cover;

}


/* ========================================
   ALBUM LABEL
======================================== */

.album-label {

  display:
    inline-block;

  padding:
    7px 15px;

  margin-bottom:
    13px;

  border:
    1px solid rgba(255,255,255,0.8);

  border-radius:
    999px;

  background:
    rgba(255,255,255,0.68);

  font-size:
    10px;

  letter-spacing:
    3px;

  font-weight:
    700;

}


/* ========================================
   MAIN TITLE
======================================== */

header h1 {

  margin:
    0;

  font-size:
    clamp(29px, 6vw, 54px);

  line-height:
    1.05;

  letter-spacing:
    1px;

  font-weight:
    800;

  text-shadow:
    0 2px 0 rgba(255,255,255,0.4);

}


header h1 span {

  display:
    block;

  margin-top:
    10px;

  font-size:
    clamp(10px, 2vw, 13px);

  letter-spacing:
    5px;

  font-weight:
    400;

  opacity:
    0.65;

}


/* ========================================
   DISC TABS
======================================== */

.disc-tabs {

  display:
    flex;

  justify-content:
    center;

  gap:
    10px;

  margin-bottom:
    28px;

}


.disc-tab {

  flex:
    0 1 190px;

  padding:
    13px 20px;

  border:
    2px solid rgba(255,255,255,0.75);

  border-radius:
    10px;

  background:
    rgba(255,255,255,0.38);

  color:
    #172033;

  cursor:
    pointer;

  font-size:
    12px;

  font-weight:
    800;

  letter-spacing:
    2px;

  box-shadow:
    0 5px 15px rgba(30,60,90,0.10);

  transition:
    all 0.25s ease;

}


.disc-tab:hover {

  transform:
    translateY(-2px);

  background:
    rgba(255,255,255,0.65);

}


.disc-tab.active {

  background:
    rgba(255,255,255,0.94);

  transform:
    translateY(-2px);

}


/* ========================================
   DISC PANEL
======================================== */

.disc-panel {

  display:
    none;

  animation:
    fadeIn 0.3s ease;

}


.disc-panel.active {

  display:
    block;

}


@keyframes fadeIn {

  from {

    opacity:
      0;

    transform:
      translateY(6px);

  }

  to {

    opacity:
      1;

    transform:
      translateY(0);

  }

}


/* ========================================
   DISC HEADING
======================================== */

.disc-heading {

  display:
    flex;

  align-items:
    baseline;

  justify-content:
    space-between;

  padding:
    0 7px 13px;

  border-bottom:
    2px solid rgba(255,255,255,0.70);

}


.disc-heading h2 {

  margin:
    0;

  font-size:
    24px;

  letter-spacing:
    2px;

}


.disc-heading span {

  font-size:
    10px;

  letter-spacing:
    2px;

  opacity:
    0.55;

}


/* ========================================
   TRACK
======================================== */

.track {

  display:
    grid;

  grid-template-columns:
    34px minmax(0,1fr) auto;

  align-items:
    center;

  gap:
    10px;

  min-height:
    67px;

  padding:
    11px 10px;

  margin:
    5px 0;

  border:
    1px solid rgba(255,255,255,0.70);

  border-radius:
    10px;

  background:
    rgba(255,255,255,0.58);

  box-shadow:
    0 3px 10px rgba(40,60,80,0.06);

  transition:
    transform 0.2s ease,
    background 0.2s ease;

}


.track:hover {

  transform:
    translateY(-1px);

  background:
    rgba(255,255,255,0.75);

}


/* ========================================
   TRACK NUMBER
======================================== */

.track-number {

  font-size:
    11px;

  opacity:
    0.55;

  text-align:
    right;

}


/* ========================================
   TRACK TITLE
======================================== */

.track-title {

  min-width:
    0;

  font-size:
    14px;

  line-height:
    1.4;

}


/* ========================================
   TRACK TIME
======================================== */

.track-time {

  display:
    inline;

  margin-left:
    6px;

  font-size:
    12px;

  opacity:
    0.55;

  white-space:
    nowrap;

}


/* ========================================
   ACTION BUTTONS
======================================== */

.track-actions {

  display:
    flex;

  flex-direction:
    row;

  align-items:
    center;

  gap:
    6px;

}


/* ========================================
   BUTTON
======================================== */

.btn {

  display:
    inline-flex;

  align-items:
    center;

  justify-content:
    center;

  min-width:
    94px;

  padding:
    9px 10px;

  border-radius:
    7px;

  text-decoration:
    none;

  font-size:
    10px;

  font-weight:
    800;

  letter-spacing:
    0.4px;

  white-space:
    nowrap;

  transition:
    transform 0.2s ease,
    opacity 0.2s ease;

}


.btn:hover {

  transform:
    translateY(-2px);

  opacity:
    0.85;

}


.play {

  background:
    #ffffff;

  color:
    #172033;

  box-shadow:
    0 3px 8px rgba(0,0,0,0.08);

}


.download {

  background:
    rgba(30,45,65,0.82);

  color:
    #ffffff;

}


/* ========================================
   BONUS TRACK
======================================== */

.bonus {

  margin-top:
    12px;

  border-style:
    dashed;

}


.bonus .track-number {

  font-weight:
    700;

}


.bonus .track-title {

  font-weight:
    700;

}


/* ========================================
   DOWNLOAD NOTIFICATION
======================================== */

.download-notice {

  position:
    fixed;

  left:
    50%;

  bottom:
    28px;

  transform:
    translate(-50%, 30px);

  z-index:
    9999;

  padding:
    13px 20px;

  border:
    1px solid rgba(255,255,255,0.8);

  border-radius:
    999px;

  background:
    rgba(30,45,65,0.92);

  color:
    #ffffff;

  font-size:
    12px;

  font-weight:
    700;

  letter-spacing:
    0.5px;

  box-shadow:
    0 8px 25px rgba(0,0,0,0.22);

  opacity:
    0;

  pointer-events:
    none;

  transition:
    opacity 0.25s ease,
    transform 0.25s ease;

}


.download-notice.show {

  opacity:
    1;

  transform:
    translate(-50%, 0);

}


/* ========================================
   FOOTER
======================================== */

footer {

  margin-top:
    35px;

  padding-top:
    20px;

  border-top:
    1px solid rgba(255,255,255,0.4);

  text-align:
    center;

  font-size:
    9px;

  letter-spacing:
    2px;

  opacity:
    0.5;

/* ========================================
   SMARTPHONE
======================================== */

@media (max-width: 700px) {

  .container {

    width:
      94%;

    padding-top:
      24px;

  }


  .jacket {

    width:

    grid-template-columns:
      25px minmax(0,1fr);

    grid-template-rows:
      auto auto;

    gap:
      4px 7px;

    padding:
      11px 8px;

  }


  /* 曲番号 */

  .track-number {

    grid-column:
      1;

    grid-row:
      1;

    padding-top:
      2px;

    font-size:
      13px;

    color:
      #000000;

    opacity:
      1;

    text-align:
      right;

  }


  /* 曲タイトル */

  .track-title {

    grid-column:
      2;

    grid-row:
      1;

    padding-left:
      0;

    font-size:
      15px;

    line-height:
      1.4;

    text-align:
      left;

    white-space:
      nowrap;

    overflow:
      hidden;

    text-overflow:
      ellipsis;

  }


  /* 時間 */

  .track-time {

    margin-left:
      5px;

    font-size:
      11px;

    opacity:
      0.55;

  }


  .track-time::before {

    content:
      "(";

  }


  .track-time::after {

    content:
      ")";

  }


  /* ボタン */

  .track-actions {

    grid-column:
      1 / 3;

    grid-row:
      2;

    display:
      flex;

    justify-content:
      center;

    align-items:
      center;

    gap:
      14px;

    width:
      100%;

    margin-top:
      3px;

    padding-left:
      0;

  }


  .btn {

    min-width:
      90px;

    padding:
      8px 9px;

    font-size:
      9px;

  }


  /* 通知 */

  .download-notice {

    bottom:
      20px;

    width:
      max-content;

    max-width:
      90%;

    padding:
      12px 17px;

    font-size:
      11px;

  }

}


/* ========================================
   SMALL SMARTPHONE
======================================== */

@media (max-width: 380px) {

  .track-title {

    font-size:
      14px;

  }


  .track-actions {

    gap:
      12px;

  }


  .btn {

    min-width:
      82px;

    padding:
      7px;

    font-size:
      9px;

  }

}

/* =====================================
   DOWNLOAD NOTICE
===================================== */

let noticeTimer = null;


function showDownloadNotice(button) {

  const notice =
    document.getElementById("downloadNotice");


  /* ボタンの表示を変更 */

  const originalText =
    button.dataset.originalText ||
    "↓ DOWNLOAD";


  button.dataset.originalText =
    originalText;


  button.textContent =
    "↓ DOWNLOADING...";


  button.style.opacity =
    "0.7";


  /* 通知を表示 */

  notice.classList.add("show");


  /* 以前のタイマーがあれば解除 */

  if (noticeTimer) {

    clearTimeout(noticeTimer);

  }


  /* 約2.5秒後に元へ戻す */

  noticeTimer =
    setTimeout(() => {

      notice.classList.remove("show");

      button.textContent =
        originalText;

      button.style.opacity =
        "";

    }, 3000);

}


/* =====================================
   CREATE TRACK
===================================== */

function createTrack(track) {

  const no =
    track[0];

  const title =
    track[1];

  const time =
    track[2];

  const id =
    track[3];

  const bonus =
    track[4];


  /* LISTEN */

  const listenURL =
    "https://drive.google.com/file/d/" +
    id +
    "/view?usp=drive_link";


  /* DOWNLOAD */

  const downloadURL =
    "https://drive.usercontent.google.com/download?id=" +
    id +
    "&export=download&confirm=t";


  const div =
    document.createElement("div");


  div.className =
    bonus
      ? "track bonus"
      : "track";


  div.innerHTML = `

    <span class="track-number">
      ${no}
    </span>


    <span class="track-title">

      ${title}

      <span class="track-time">
        ${time}
      </span>

    </span>


    <div class="track-actions">


      <a
        class="btn play"
        href="${listenURL}"
        target="_blank"
        rel="noopener"
      >
        ▶ LISTEN
      </a>


      <a
        class="btn download"
        href="${downloadURL}"
        target="_blank"
        rel="noopener"
        download
      >
        ↓ DOWNLOAD
      </a>


    </div>

  `;


  /* =================================
     DOWNLOAD CLICK
  ================================= */

  const downloadButton =
    div.querySelector(".download");


  downloadButton.addEventListener(
    "click",
    function() {

      showDownloadNotice(this);

    }
  );


  return div;

}


/* =====================================
   RENDER TRACKS
===================================== */

function renderTracks() {

  const container1 =
    document.getElementById("tracks1");


  const container2 =
    document.getElementById("tracks2");


  disc1.forEach(track => {

    container1.appendChild(
      createTrack(track)
    );

  });


  disc2.forEach(track => {

    container2.appendChild(
      createTrack(track)
    );

  });

}

function showDisc(number) {


  document
    .querySelectorAll(".disc-panel")
    .forEach(panel => {

      panel.classList.remove(
        "active"
      );

    });


  document
    .querySelectorAll(".disc-tab")
    .forEach(tab => {

      tab.classList.remove(
        "active"
      );

    });


  document
    .getElementById(
      "disc" + number
    )
    .classList.add(
      "active"
    );


  document
    .querySelectorAll(
      ".disc-tab"
    )[number - 1]
    .classList.add(
      "active"
    );


  document.body.className =
    "disc" + number;


  const jacket =
    document.getElementById(
      "jacketImage"
    );


  if (number === 1) {

    jacket.src =
      "disc1.jpg";

    jacket.alt =
      "NIGO's AI Sound Collection DISC 1";

  }

  else {

    jacket.src =
      "disc2.jpg";

    jacket.alt =
      "NIGO's AI Sound Collection DISC 2";

  }


  window.scrollTo({

    top:
      0,

    behavior:
      "smooth"

  });

}
