<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIGO's AI Sound Collection</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at top, #252525 0%, #111 45%, #090909 100%);
  color: #fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
}

.container {
  width: min(920px, 92%);
  margin: 0 auto;
  padding: 55px 0 70px;
}

/* =========================
   HEADER
========================= */

header {
  text-align: center;
  margin-bottom: 42px;
}

.album-label {
  display: inline-block;
  margin-bottom: 15px;
  padding: 6px 14px;
  border: 1px solid #555;
  border-radius: 999px;
  color: #aaa;
  font-size: 11px;
  letter-spacing: 3px;
}

header h1 {
  margin: 0;
  font-size: clamp(30px, 7vw, 58px);
  line-height: 1.05;
  letter-spacing: 2px;
  font-weight: 800;
}

header h1 span {
  display: block;
  margin-top: 10px;
  font-size: clamp(12px, 2vw, 15px);
  color: #888;
  letter-spacing: 5px;
  font-weight: 400;
}

/* =========================
   DISC TABS
========================= */

.disc-tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 30px;
}

.disc-tab {
  border: 1px solid #444;
  background: #181818;
  color: #888;
  padding: 12px 28px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  transition: all 0.25s ease;
}

.disc-tab:hover {
  border-color: #777;
  color: #fff;
  transform: translateY(-1px);
}

.disc-tab.active {
  background: #fff;
  color: #111;
  border-color: #fff;
}

/* =========================
   TRACK LIST
========================= */

.disc-panel {
  display: none;
  animation: fadeIn 0.25s ease;
}

.disc-panel.active {
  display: block;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.disc-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
  padding-bottom: 14px;
  border-bottom: 1px solid #444;
}

.disc-heading h2 {
  margin: 0;
  font-size: 25px;
  letter-spacing: 2px;
}

.disc-heading span {
  color: #666;
  font-size: 12px;
}

.track {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 72px;
  padding: 13px 0;
  border-bottom: 1px solid #252525;
}

.track-number {
  width: 34px;
  color: #666;
  font-size: 12px;
  text-align: right;
  flex-shrink: 0;
}

.track-title {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  line-height: 1.4;
}

.track-actions {
  display: flex;
  gap: 7px;
  flex-shrink: 0;
}

/* =========================
   BUTTONS
========================= */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 104px;
  padding: 9px 12px;
  border-radius: 7px;
  text-decoration: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  transition:
    transform 0.2s ease,
    opacity 0.2s ease,
    background 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
  opacity: 0.85;
}

.btn:active {
  transform: translateY(0);
}

.play {
  background: #fff;
  color: #111;
}

.download {
  background: #292929;
  color: #ddd;
  border: 1px solid #444;
}

/* =========================
   BONUS
========================= */

.bonus {
  margin-top: 12px;
  padding-top: 18px;
  border-top: 1px solid #555;
}

.bonus .track-number {
  color: #aaa;
}

.bonus .track-title {
  font-weight: 700;
}

/* =========================
   JACKET PLACEHOLDER
   後から画像を追加できます
========================= */

.jacket {
  width: min(360px, 75vw);
  aspect-ratio: 1 / 1;
  margin: 0 auto 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #333;
  background: #151515;
  color: #555;
  text-align: center;
  font-size: 12px;
  letter-spacing: 2px;
  overflow: hidden;
}

.jacket img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  cursor: pointer;
}

/* =========================
   FOOTER
========================= */

footer {
  margin-top: 55px;
  padding-top: 20px;
  border-top: 1px solid #222;
  text-align: center;
  color: #555;
  font-size: 11px;
  letter-spacing: 1px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

  .container {
    padding-top: 30px;
  }

  header {
    margin-bottom: 30px;
  }

  .disc-tabs {
    gap: 7px;
  }

  .disc-tab {
    flex: 1;
    padding: 11px 8px;
  }

  .track {
    align-items: flex-start;
    gap: 9px;
    padding: 14px 0;
  }

  .track-number {
    width: 22px;
    padding-top: 4px;
  }

  .track-title {
    padding-top: 3px;
    font-size: 13px;
  }

  .track-actions {
    flex-direction: column;
    gap: 5px;
  }

  .btn {
    min-width: 82px;
    padding: 7px 6px;
    font-size: 10px;
  }

  .jacket {
    width: min(300px, 80vw);
  }
}
</style>
</head>

function createTrack(track) {

  const listenURL =
    "https://drive.google.com/file/d/" +
    track.id +
    "/view?usp=drive_link";

  const downloadURL =
    "https://drive.google.com/uc?export=download&id=" +
    track.id;

  const div = document.createElement("div");

  div.className =
    track.bonus
      ? "track bonus"
      : "track";

  div.innerHTML = `

    <span class="track-number">
      ${track.no}
    </span>

    <span class="track-title">
      ${track.title}
      ${track.bonus ? "<small> (Bonus Track)</small>" : ""}
    </span>

    <div class="track-actions">

      <a
        class="btn play"
        href="${listenURL}"
        target="_blank"
        rel="noopener"
      >
        ▶ LISTEN
      </a>

      <a
        class="btn download"
        href="${downloadURL}"
        target="_blank"
        rel="noopener"
      >
        ↓ DOWNLOAD
      </a>

    </div>

  `;

  return div;
}

function renderTracks() {

  const container1 =
    document.getElementById("tracks1");

  const container2 =
    document.getElementById("tracks2");

  disc1.forEach(track => {
    container1.appendChild(
      createTrack(track)
    );
  });

  disc2.forEach(track => {
    container2.appendChild(
      createTrack(track)
    );
  });

}

function showDisc(number) {

  document
    .querySelectorAll(".disc-panel")
    .forEach(panel => {
      panel.classList.remove("active");
    });

  document
    .querySelectorAll(".disc-tab")
    .forEach(tab => {
      tab.classList.remove("active");
    });

  document
    .getElementById("disc" + number)
    .classList.add("active");

  document
    .querySelectorAll(".disc-tab")[number - 1]
    .classList.add("active");

}
